name: Lua syntax check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install luaparse
        run: npm install --no-save luaparse

      - name: Parse every Lua plugin
        run: node tools/check-lua.js
